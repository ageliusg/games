<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Inner Shadow / Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#glowBorder)" stroke-width="12" />

  <!-- Anti-Gravity Levitation Orbital Ring -->
  <ellipse cx="256" cy="380" rx="140" ry="24" fill="none" stroke="url(#neonCyan)" stroke-width="6" opacity="0.4" stroke-dasharray="16 10" />

  <!-- Controller Body Silhouette (Sleek Geometric Arcade Pad) -->
  <g transform="translate(0, -10)">
    <!-- Controller Main Shell -->
    <path d="M 160 170 C 130 170, 96 195, 84 250 C 72 305, 96 350, 134 350 C 160 350, 185 320, 210 290 C 230 265, 282 265, 302 290 C 327 320, 352 350, 378 350 C 416 350, 440 305, 428 250 C 416 195, 382 170, 352 170 Z" 
          fill="#131b2e" stroke="url(#neonCyan)" stroke-width="10" stroke-linejoin="round" />

    <!-- Grip Accents / Neon Grips -->
    <path d="M 98 255 C 92 290, 106 325, 130 330" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M 414 255 C 420 290, 406 325, 382 330" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" opacity="0.8" />

    <!-- D-Pad (Left Side) -->
    <!-- Horizontal Bar -->
    <rect x="132" y="235" width="60" height="20" rx="5" fill="#38bdf8" />
    <!-- Vertical Bar -->
    <rect x="152" y="215" width="20" height="60" rx="5" fill="#38bdf8" />
    <!-- Center Joint -->
    <rect x="152" y="235" width="20" height="20" fill="#0284c7" />

    <!-- Action Buttons Diamond (Right Side) -->
    <!-- North Button (Emerald) -->
    <circle cx="346" cy="225" r="9" fill="#10b981" />
    <!-- East Button (Magenta) -->
    <circle cx="366" cy="245" r="9" fill="#ec4899" />
    <!-- South Button (Amber) -->
    <circle cx="346" cy="265" r="9" fill="#f59e0b" />
    <!-- West Button (Cyan) -->
    <circle cx="326" cy="245" r="9" fill="#38bdf8" />

    <!-- Center Antigravity Core / Chevron Pulse -->
    <circle cx="256" cy="226" r="14" fill="#a855f7" />
    <path d="M 256 218 L 261 228 L 251 228 Z" fill="#ffffff" />
    <path d="M 256 234 L 261 224 L 251 224 Z" fill="#ffffff" opacity="0.6" />

    <!-- Twin Mini LED Status Indicators -->
    <circle cx="236" cy="202" r="3.5" fill="#38bdf8" opacity="0.9" />
    <circle cx="276" cy="202" r="3.5" fill="#a855f7" opacity="0.9" />
  </g>

  <!-- Sparkle / Particle Accents -->
  <path d="M 384 110 Q 384 130 364 130 Q 384 130 384 150 Q 384 130 404 130 Q 384 130 384 110" fill="#38bdf8" />
  <path d="M 120 140 Q 120 152 108 152 Q 120 152 120 164 Q 120 152 132 152 Q 120 152 120 140" fill="#a855f7" />
</svg>
